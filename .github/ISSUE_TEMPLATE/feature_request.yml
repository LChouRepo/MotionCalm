name: Feature request / 功能建议 / 功能建議
description: Suggest an idea or a game-specific improvement. 提出新功能或改进建议。提出新功能或改進建議。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! You can write in English, 简体中文 or 繁體中文.
        Note: MotionCalm will not inject into games, read game memory or install low-level input hooks,
        so ideas that need those are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Which game or situation still makes you motion sick, or what is hard to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like MotionCalm to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried
      description: Game settings, mods, other MotionCalm settings, other tools.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Research, screenshots, links.
