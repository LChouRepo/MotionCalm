; MotionCalm 配置文件（UTF-8 编码）。可以用记事本修改，保存后约 0.5 秒自动生效。
; 程序保存设置时会按这份模板重写整个文件：这些说明会保留，你自己加的注释不会保留。
; 规则：布尔值只认 0 / 1；颜色写 RRGGBB（6 位十六进制，不带 #）；小数一律用英文句点。
; 名单类的值（exclude、force_game、known_games）用 ; 分隔，名单行的末尾不要写注释。
; 写错的值会换成默认值，超出范围的值会被截断，原因记在 MotionCalm.log 里。

[general]
; 是否启用遮罩：1 = 启用，0 = 关闭
enabled=1
; 遮罩强度档位：light（轻）、medium（中）、strong（强）
mask_level=medium              ; light | medium | strong
; 触发灵敏度：low（低）、medium（中）、high（高）
sensitivity=medium             ; low | medium | high
; 开机自动启动：1 = 是，0 = 否
autostart=0
; 遮罩是否对截屏 / 录屏 / 屏幕共享隐藏：auto（随截屏运动检测）、always（总是隐藏）、never（从不隐藏）
hide_from_capture=auto         ; auto | always | never
; 日志级别：debug、info、warn
log_level=info                 ; debug | info | warn

[mask]
; 遮罩颜色 RRGGBB，默认纯黑 000000
color=000000
; 轻档满强度时屏幕边缘的最深不透明度，范围 0–1
max_opacity_light=0.60
; 中档满强度时屏幕边缘的最深不透明度，范围 0–1
max_opacity_medium=0.75
; 强档满强度时屏幕边缘的最深不透明度，范围 0–1
max_opacity_strong=0.85
; 满强度时清晰区直径 / 屏幕高度（轻档），范围 0.05–1
clear_height_light=0.65        ; 满强度时清晰区直径 / 屏幕高度
; 满强度时清晰区直径 / 屏幕高度（中档），范围 0.05–1
clear_height_medium=0.60
; 满强度时清晰区直径 / 屏幕高度（强档），范围 0.05–1
clear_height_strong=0.55
; 清晰区椭圆的横向半径 / 纵向半径，范围 0.5–3（大于 1 时横向更宽）
ellipse_ratio=1.25             ; 横向半径 / 纵向半径
; 遮罩边缘的羽化宽度（相对清晰区半径），范围 0.05–1
feather=0.35
; 遮罩出现所需时间（毫秒，整数），范围 10–2000
attack_ms=100
; 遮罩淡出所需时间（毫秒，整数），范围 10–5000
release_ms=500

[dots]
; 中心参照点：1 = 显示，0 = 不显示
center_dot=1
; 中心点半径（100% 缩放下的像素，整数），范围 1–20
center_dot_radius_px=3
; 中心点颜色 RRGGBB
center_dot_color=FFFFFF
; 中心点外圈的深色描边：1 = 有，0 = 无
center_dot_outline=1
; 边缘参照点（四角加四边中点，共 8 个）：1 = 显示，0 = 不显示
edge_dots=1
; 边缘点半径（100% 缩放下的像素，整数），范围 1–20
edge_dot_radius_px=3
; 边缘点颜色 RRGGBB
edge_dot_color=C8C8C8
; 强度为 0 时边缘点的不透明度，范围 0–1
edge_dot_min_alpha=0.15
; 满强度时边缘点的不透明度，范围 0–1
edge_dot_max_alpha=0.75
; 边缘点离屏幕边缘的距离（100% 缩放下的像素，整数），范围 0–400
edge_dot_margin_px=24

[trigger]
; 鼠标转视角时触发遮罩：1 = 是，0 = 否
mouse=1
; 按 WASD / 方向键移动时触发遮罩：1 = 是，0 = 否
keyboard=1
; 手柄操作时触发遮罩：1 = 是，0 = 否
gamepad=1
; 截屏运动检测：从屏幕画面估计镜头转动，过场动画、载具、被击退等不是你操作的转动也能触发遮罩：1 = 开，0 = 关
capture=1                      ; 截屏运动检测 0 | 1
; 截屏运动检测的灵敏度：low（低，阈值为鼠标的 2 倍）、medium（中，1.5 倍）、high（高，与鼠标相同）
capture_sensitivity=medium     ; low | medium | high
; 未校准时每转 1 度对应的鼠标计数（约为 800 DPI 加常见灵敏度），范围 1–1000
default_counts_per_degree=18.2
; 低灵敏度：开始出现遮罩的转速（度/秒），范围 1–5000
v_start_low=120
; 低灵敏度：遮罩达到满强度的转速（度/秒），范围 1–5000，必须大于 v_start_low
v_full_low=600
; 中灵敏度：开始出现遮罩的转速（度/秒），范围 1–5000
v_start_medium=60
; 中灵敏度：遮罩达到满强度的转速（度/秒），范围 1–5000，必须大于 v_start_medium
v_full_medium=360
; 高灵敏度：开始出现遮罩的转速（度/秒），范围 1–5000
v_start_high=30
; 高灵敏度：遮罩达到满强度的转速（度/秒），范围 1–5000，必须大于 v_start_high
v_full_high=200
; 只移动、不转视角时的遮罩强度，范围 0–1
move_intensity=0.35
; 手柄右摇杆推满时相当于的转速（度/秒），范围 10–2000
gamepad_max_deg_per_s=300
; 手柄摇杆的径向死区，范围 0–0.9
gamepad_deadzone=0.20
; 判断鼠标被游戏锁住的规则：strict（光标隐藏，并且被限制在窗口内或每帧回中）、hidden（光标隐藏即可）
mouse_lock_rule=strict         ; strict | hidden
; 计算鼠标转速用的时间窗口（毫秒，整数），范围 10–500
velocity_window_ms=50

[detect]
; 排除名单：这些程序永远不触发遮罩（不区分大小写，用 ; 分隔）
exclude=chrome.exe;msedge.exe;firefox.exe;brave.exe;opera.exe;opera_gx.exe;vivaldi.exe;arc.exe;vlc.exe;PotPlayerMini64.exe;PotPlayer64.exe;PotPlayerMini.exe;mpc-hc64.exe;mpc-hc.exe;mpv.exe;wmplayer.exe;Video.UI.exe;Netflix.exe;Spotify.exe;Discord.exe;explorer.exe;obs64.exe
; 强制视为游戏的程序，托盘"把当前程序视为游戏"会加到这里（用 ; 分隔）
force_game=
; 已知游戏：程序第一次锁住鼠标时自动加入（用 ; 分隔，可以清空）
known_games=

[hotkeys]                      ; 格式 Ctrl+Alt+Shift+Win+<Key>，None 表示不绑定
; 可用按键：F1–F24、A–Z、0–9、Space、Tab、Esc、Pause、Insert、Delete、Home、End、PgUp、PgDn、
; Up、Down、Left、Right、Num0–Num9、VK_OEM_1、VK_OEM_PLUS、VK_OEM_COMMA、VK_OEM_MINUS、
; VK_OEM_PERIOD、VK_OEM_2 … VK_OEM_8、VK_OEM_102；不带修饰键的单键会吃掉游戏里的这个键。
; 启用 / 关闭遮罩
toggle=Ctrl+Alt+F9
; 循环遮罩强度（轻 → 中 → 强）
cycle_level=Ctrl+Alt+F10
; 中心参照点开关
toggle_center_dot=Ctrl+Alt+F11
; 显示调试信息
debug_bar=Ctrl+Alt+F8
; 校准当前游戏（游戏内转一圈 ×2）
calibrate=Ctrl+Alt+F7
; 截屏运动检测开关
toggle_capture=Ctrl+Alt+F6
; 循环触发灵敏度（低 → 中 → 高）
cycle_sensitivity=None
; 边缘参照点开关
toggle_edge_dots=None
; 打开设置窗口（托盘"设置…"或双击托盘图标也可以打开）
open_settings=None
; 把当前程序视为游戏
mark_game=None
; 把当前程序加入排除名单
exclude_app=None
; 退出
exit=None

[calibration]                  ; <exe 小写>=<每度鼠标计数>;<校准日期>，由"校准当前游戏"自动写入
; 每行一个游戏，例如 cs2.exe=18.400;2026-11-01（日期可省略）；删掉某一行，该游戏就改用 [trigger] 的 default_counts_per_degree。
; 合法范围约 2.222–1111.111（转一整圈 800–400000 计数），超出范围的行会被忽略。

[capture]                      ; 截屏运动检测的参数，一般不用改
; 先把屏幕画面缩小成 grid_w × grid_h 格的灰度图，再估计整个画面的平移。网格宽（格，整数），范围 64–320
grid_w=160
; 网格高（格，整数），范围 36–180
grid_h=90
; 相邻两帧之间最多找多远的平移（格，整数），范围 2–40；默认 20 格在 1080p 下约 240 像素
max_shift=20
; 最低置信度：低于它的帧（换场景、闪光、纯色画面）不更新转速，范围 0.10–0.99
min_correlation=0.60
; 假定的游戏水平视野（度），用来把画面平移换算成转速，范围 30–170
assumed_hfov_deg=90
; 置信度低或画面没有更新时，沿用上一次转速的最长时间（毫秒，整数），范围 0–1000
hold_ms=100
; 前进 / 后退的灵敏度：画面向外扩张（前进）或向内收缩（后退）换算成速度后再乘的倍数，范围 0.5–3.0
forward_gain=1.0
; 识别画面倾斜（镜头左右侧倾，例如游泳时侧移）：1 = 是，0 = 否
detect_roll=1
; 前进 / 倾斜估计与多久之前的画面比较（毫秒，整数），范围 0–150；越长越能看出缓慢的前进，0 = 只与上一帧比较
baseline_ms=66
; 以下是前进 / 后退与画面倾斜自己的阈值（度/秒），按 [general] sensitivity 选档，不乘 capture_sensitivity 的系数；
; 低档 ≈ 中档 × 2（开始）/ × 5/3（满），高档 ≈ 中档 × 0.5 / × 5/9，与 [trigger] 鼠标阈值三档的比例相同
; 低灵敏度：前进 / 后退时画面边缘的流速达到多少开始出现遮罩（度/秒），范围 1–5000
zoom_start_low=40
; 低灵敏度：前进 / 后退达到满强度的流速（度/秒），范围 1–5000，必须大于 zoom_start_low
zoom_full_low=250
; 中灵敏度：前进 / 后退时画面边缘的流速达到多少开始出现遮罩（度/秒），范围 1–5000
zoom_start_medium=20
; 中灵敏度：前进 / 后退达到满强度的流速（度/秒），范围 1–5000，必须大于 zoom_start_medium
zoom_full_medium=150
; 高灵敏度：前进 / 后退时画面边缘的流速达到多少开始出现遮罩（度/秒），范围 1–5000
zoom_start_high=10
; 高灵敏度：前进 / 后退达到满强度的流速（度/秒），范围 1–5000，必须大于 zoom_start_high
zoom_full_high=83
; 低灵敏度：画面倾斜（旋转）达到多少开始出现遮罩（度/秒），范围 1–5000
roll_start_low=30
; 低灵敏度：画面倾斜达到满强度的角速度（度/秒），范围 1–5000，必须大于 roll_start_low
roll_full_low=150
; 中灵敏度：画面倾斜（旋转）达到多少开始出现遮罩（度/秒），范围 1–5000
roll_start_medium=15
; 中灵敏度：画面倾斜达到满强度的角速度（度/秒），范围 1–5000，必须大于 roll_start_medium
roll_full_medium=90
; 高灵敏度：画面倾斜（旋转）达到多少开始出现遮罩（度/秒），范围 1–5000
roll_start_high=8
; 高灵敏度：画面倾斜达到满强度的角速度（度/秒），范围 1–5000，必须大于 roll_start_high
roll_full_high=50

[ui]                           ; 界面语言与设置窗口自己的界面状态，由设置窗口自动维护
; 界面语言：auto（跟随 Windows 显示语言）、zh-CN（简体中文）、zh-TW（繁體中文）、en（English）
language=auto                  ; auto | zh-CN | zh-TW | en
; 各页是否显示"高级选项" 0 | 1
show_advanced=0
; 设置窗口上次的位置（左上角的屏幕坐标，像素，整数）；留空 = 居中显示在鼠标所在的显示器上
x=
y=
